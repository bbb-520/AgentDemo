spring:
  application.name: agent-media-service
  config.import: optional:nacos:agent-media-service.yml?group=AGENT_GROUP&refreshEnabled=true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USERNAME:agent}
    password: ${MYSQL_PASSWORD:change-me}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  cloud:
    compatibility-verifier.enabled: false
    nacos:
      discovery.server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config.server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    sentinel:
      transport.dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
feign:
  sentinel.enabled: true
server:
  port: ${SERVER_PORT:18082}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
