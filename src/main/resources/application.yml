server:
  port: 18080
  shutdown: graceful

spring:
  codec:
    # 图片编辑接口默认允许 10 MB 源图，并留出 multipart / JSON 包装余量。
    max-in-memory-size: 12MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bbb_agent_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      # schema.sql 由本地初始化脚本显式执行，避免应用启动时因数据库权限导致不可控建表。
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 10s
  ai:
    openai:
      api-key: ${QWEN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      timeout: 60s
      max-retries: 2
      chat:
        model: qwen-turbo   # 或 qwen-plus / qwen-max
        # 图片消息使用兼容 OpenAI multimodal content 的视觉模型。
        vision-model: ${QWEN_VISION_MODEL:qwen-vl-plus}
    chat:
      memory:
        repository:
          redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}
            key-prefix: "chat:memory:"
            # 会话记忆在 Redis 中的存活时间：只保存对话，到期自动清理
            time-to-live: 7d
            # 启动时自动建立记忆 JSON 索引
            initialize-schema: true

    mcp:
      client:
        enabled: true
        name: bbb-mcp-client
        version: 1.0.0
        type: async
        request-timeout: 60s
        toolcallback:
          enabled: false
      server:
        enabled: true
        name: bbb-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
        type: sync
        # 工具集说明，宿主会作为背景提示交给模型
        instructions: >-
          出行助手工具集。getWeather 查询指定城市的实时天气（温度/天气/湿度/风速）；
          getAttraction 根据城市与当前天气联网检索值得去的景点及理由。
          推荐先调用 getWeather 拿到天气，再把天气描述传给 getAttraction。
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          prompt: false
          resource: false
          completion: false
        request-timeout: 60s
        streamable-http:
          mcp-endpoint: /mcp

tavily:
  api-key: ${TAVILY_API_KEY:}
  base-url: https://api.tavily.com
  search-depth: advanced
  max-results: 5
  include-answer: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    org.springframework.ai: INFO
    org.springframework.ai.chat.client: INFO

app:
  oss:
    enabled: ${OSS_ENABLED:true}
    region: ${ALIYUN_OSS_REGION:cn-beijing}
    bucket: ${ALIYUN_OSS_BUCKET:bbb-image-prod}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    source-prefix: ${OSS_SOURCE_PREFIX:source}
    output-prefix: ${OSS_OUTPUT_PREFIX:output}
    thumbnail-prefix: ${OSS_THUMBNAIL_PREFIX:thumbnail}
    archive-prefix: ${OSS_ARCHIVE_PREFIX:one-and-one}
    upload-policy-ttl: ${OSS_UPLOAD_POLICY_TTL:600s}
    signed-url-ttl: ${OSS_SIGNED_URL_TTL:600s}
    max-object-bytes: ${OSS_MAX_OBJECT_BYTES:20971520}
  zine:
    enabled: ${ZINE_ENABLED:true}
    # 优先使用 DASHSCOPE_API_KEY；兼容现有项目的 QWEN_API_KEY 命名。
    api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:}}
    base-url: ${ZINE_IMAGE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    endpoint: ${ZINE_IMAGE_ENDPOINT:/services/aigc/multimodal-generation/generation}
    model: ${ZINE_IMAGE_MODEL:qwen-image-3.0-pro}
    size: ${ZINE_IMAGE_SIZE:1024*1707}
    prompt-extend: ${ZINE_PROMPT_EXTEND:true}
    watermark: ${ZINE_WATERMARK:false}
    timeout: ${ZINE_IMAGE_TIMEOUT:180s}
    max-upload-bytes: ${ZINE_MAX_UPLOAD_BYTES:20971520}
  image-jobs:
    enabled: ${IMAGE_JOBS_ENABLED:true}
    poll-interval: ${IMAGE_JOBS_POLL_INTERVAL:3000ms}
    max-attempts: ${IMAGE_JOBS_MAX_ATTEMPTS:2}
  security:
    # 未接入登录系统时，使用 HttpOnly 匿名 Cookie 维持本地实验用户边界。
    anonymous-cookie-name: bbb_agent_anonymous_id
    session-cookie-name: bbb_agent_session
    default-tenant-id: local

---

spring:
  config:
    activate:
      on-profile: github
  ai:
    mcp:
      client:
        toolcallback:
          enabled: true
        stdio:
          connections:
            github:
              command: cmd.exe
              args: ["/c", "npx", "-y", "@modelcontextprotocol/server-github"]
              env:
                # 取自 Windows 用户级环境变量，配置文件里不再出现明文
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:}
