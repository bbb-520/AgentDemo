# 会话记忆（二级记忆方案 + Redis 8 改造）
chat:
  memory:
    # 一级（短时）：LRU 内存窗口，供 LLM 实时上下文，进程内、低延迟
    window-size: 50
    # 内存中最大驻留会话数（超出按 LRU 淘汰，0 表示不限制）
    max-conversations: 1000
    # 二级（长时）：RedisJSON 文档 + RediSearch 内置索引
    redis:
      key-prefix: "chat:memory:"
      time-to-live: 7d
      max-messages-per-conversation: 1000
      # === Redis 8 改造新增 ===
      index-name: "chat-memory-idx"
      initialize-schema: true
      # 启动期自动清理旧 Sorted Set 结构（改造前演示残留）。关闭后保留旧 key，新写入走新结构
      cleanup-legacy-on-startup: true
      # 压缩任务改用 Redis Streams 持久化（重启不丢任务）
      streams:
        enabled: true
        key: "chat:memory:compress-tasks"
        consumer-group: "memory-compressors"
        # 单实例消费者名（多实例部署时建议用 ${HOSTNAME} 等环境变量区分）
        consumer-name: "consumer-1"
        poll-interval-ms: 30000
        batch-size: 20
    # 压缩概括：空闲后对旧历史生成摘要，减少引用时 token 用量
    summary:
      keep-recent: 10
      idle-minutes: 10
      max-length: 200
      # streams.enabled=true 时本字段不再生效（轮询交给 Streams）
      scan-interval-seconds: 60
      enabled: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    org.springframework.ai: DEBUG   # 观察多轮工具调用（契约 §3）
    org.springframework.ai.chat.client: DEBUG
    com.bbb.exercise.agentdemo1_0.memory: DEBUG   # 会话记忆二级存储调试
